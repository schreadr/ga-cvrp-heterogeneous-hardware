# FPGA Target Part
part=xcu55c-fsvh2892-2L-e

[hls]
# Hardware configuration parameters
syn.top=processing_node
clock=3.33ns

# 1. Synthesis File
# All submodules (crossover, mutate, repair_fitness, two_opt, util) are header-only,
# so only processing_node.cpp is registered as a synthesis compilation unit.
syn.file=processing_node.cpp
syn.cflags=-I. -Isw

# 2. Testbench Files
tb.file=tb/processing_node_test.cpp
tb.file=tb/test_helper.cpp
tb.file=tb/crossover_test.cpp
tb.file=tb/mutate_test.cpp
tb.file=tb/repair_fitness_test.cpp
tb.file=tb/two_opt_test.cpp
tb.file=tb/util_test.cpp
tb.file=sw/cvrp_types.cpp
tb.file=sw/genome_hash.cpp
tb.file=sw/ga_operators.cpp
tb.file=sw/encoding_validator.cpp
tb.file=sw/ga_engine.cpp
tb.file=sw/ga_streaming.cpp
tb.file=sw/problem_parser.cpp
tb.file=problem_instances/P-n16-k8.vrp
tb.file=problem_instances/P-n40-k5.vrp
tb.file=problem_instances/X-n1001-k43.vrp

# 3. Compiler & Simulation Configurations
tb.cflags=-std=c++17 -I. -Itb -Isw
csim.clean=true
csim.ldflags=-pthread
cosim.ldflags=-pthread
