# The FPGA target must sit at the absolute top of the file, above everything else
part=xcu55c-fsvh2892-2L-e

[hls]
# Hardware configuration parameters
syn.top=processing_node
clock=3.33ns

# Source and Testbench File Paths
syn.file=processing_node.cpp
tb.file=processing_node_tb.cpp
tb.file=../../../../sw/src/ga_streaming.cpp

# C-Simulation configurations (No separate section, just use the 'csim.' prefix)
csim.clean=true
csim.cflags=-std=c++17 -pthread
csim.ldflags=-pthread
